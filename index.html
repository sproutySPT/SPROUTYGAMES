<!-- Existing scripts preserved; add a small, minimal script that only updates game-card anchors to the requested GitHub Pages links. -->
<script>
// Minimal DOM-only patch — does not alter other content. It targets only anchors with class "game-card" and matches by game title text.
(function(){
  const mapping = {
    '주식시뮬레이터': 'https://sproutySPT.github.io/Zoosick---gang/',
    '나무패기': 'https://sproutySPT.github.io/LUMBERJAAAACK/',
    '네온라이더': 'https://sproutySPT.github.io/NEONRIDER/'
  };
  // Run after DOM ready
  function applyLinks(){
    document.querySelectorAll('a.game-card, a.game-card.featured').forEach(a=>{
      try{
        const text = (a.textContent||'').replace(/\s+/g,'');
        Object.keys(mapping).forEach(title=>{
          if(text.indexOf(title.replace(/\s+/g,'')) !== -1){
            a.href = mapping[title];
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
        });
      }catch(e){/* ignore */}
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyLinks);
  } else { applyLinks(); }
})();
</script>
