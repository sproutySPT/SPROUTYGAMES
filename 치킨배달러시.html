<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="/sprouty-lang.js"></script>
<title>치킨 배달 러시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --cy:#37e6ff;--mg:#ff4fd8;--or:#ff8a1a;--ye:#ffd84a;--gr:#4dff9a;--rd:#ff4a4a;--bg:#0a0716;
  --font:"Galmuri11","Galmuri9","DotGothic16","Malgun Gothic",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#05040c;overflow:hidden;font-family:var(--font);color:#fff;touch-action:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a0f3a 0%,#05040c 70%)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

#stage{position:relative;height:100dvh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:var(--bg);
  box-shadow:0 0 50px rgba(255,79,216,.18),0 0 100px rgba(55,230,255,.1)}
#stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;z-index:1}
/* 빛 번짐 (은은하게) */
#g1{z-index:2;filter:blur(2.5px) saturate(1.3) brightness(1.1);mix-blend-mode:screen;opacity:.5}
#g2{z-index:3;filter:blur(11px) saturate(1.4) brightness(1.2);mix-blend-mode:screen;opacity:.5}
#scan{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
#vig{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.6) 100%)}

.neon{text-shadow:0 0 2px currentColor,0 0 7px currentColor,0 0 14px currentColor}

/* 픽셀 버튼 */
.pbtn{position:relative;display:block;width:78%;max-width:300px;margin:10px auto 0;padding:14px 10px;text-align:center;
  font-size:clamp(15px,4.8vw,22px);letter-spacing:2px;color:#0a0716;
  box-shadow:-4px 0 0 0 #05030c,4px 0 0 0 #05030c,0 -4px 0 0 #05030c,0 4px 0 0 #05030c,
             inset -4px -4px 0 0 rgba(0,0,0,.28),inset 4px 4px 0 0 rgba(255,255,255,.4),0 0 16px var(--gl);
  transition:transform .08s}
.pbtn:active{transform:translateY(4px)}
.p1{background:var(--ye);--gl:rgba(255,216,74,.55);animation:blink 1.3s infinite alternate}
.p2{background:var(--cy);--gl:rgba(55,230,255,.45)}
.p3{background:#2a2050;color:#c9b8ff;--gl:rgba(167,139,255,.3);font-size:clamp(12px,3.6vw,16px);padding:10px}
@keyframes blink{from{filter:brightness(.95)}to{filter:brightness(1.15)}}

#hud{position:absolute;left:0;right:0;top:0;z-index:7;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none;display:none}
#hud .r1{display:flex;justify-content:space-between;align-items:flex-start;font-size:clamp(11px,3.4vw,16px)}
#hearts{color:var(--rd);letter-spacing:2px;font-size:1.25em}
#coinsV{color:var(--ye);font-size:.8em;margin-top:2px}
#tips{color:var(--ye);text-align:center;font-size:1.3em}
#tips small{display:block;font-size:.6em;color:#b9a560;text-shadow:none}
#dist{color:var(--cy);text-align:right}
#dist small{display:block;font-size:.6em;color:#5fa9b8;text-shadow:none}
.tempwrap{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:clamp(10px,3vw,14px);color:var(--or)}
.tempbar{flex:1;height:12px;border:2px solid #3a2a50;background:#0a0716;position:relative}
#tfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff3b3b,#ff8a1a,#ffd84a)}
#tfill.cold{background:linear-gradient(90deg,#3b6bff,#5aa8ff,#a8e0ff);animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.6}to{opacity:1}}
#next{margin-top:6px;font-size:clamp(9px,2.8vw,12px);color:var(--gr);text-align:center;opacity:.9}

#banner{position:absolute;left:0;right:0;top:34%;z-index:8;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 1.6s ease-out}
#banner b{display:block;font-size:clamp(22px,8vw,40px);color:var(--gr);letter-spacing:2px}
#banner span{display:block;margin-top:8px;font-size:clamp(12px,3.8vw,19px);color:var(--ye)}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

.ov{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;text-align:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 22px)}
.ov[hidden]{display:none}
.menu{justify-content:space-between;background:linear-gradient(180deg,rgba(10,7,22,.7) 0,rgba(10,7,22,0) 34%,rgba(10,7,22,0) 58%,rgba(10,7,22,.85) 100%)}
.wchip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:#120d26;font-size:clamp(12px,3.6vw,16px);color:var(--ye);
  box-shadow:-3px 0 0 0 #3a2a60,3px 0 0 0 #3a2a60,0 -3px 0 0 #3a2a60,0 3px 0 0 #3a2a60}
.coin{color:var(--ye);font-size:1.2em}
.mHead{margin-top:2vh}
.mSmall{font-size:clamp(9px,2.8vw,12px);color:#8c80b8;letter-spacing:3px;margin-bottom:10px}
.title{font-size:clamp(34px,12.5vw,62px);line-height:1.12;color:var(--or);margin:0;letter-spacing:2px;animation:flick 3.4s infinite}
.title em{font-style:normal;color:var(--cy)}
@keyframes flick{0%,18%,22%,60%,63%,100%{opacity:1}20%,62%{opacity:.6}21%{opacity:.9}}
.mTag{margin-top:12px;font-size:clamp(10px,3.2vw,14px);color:#c9b8ff;line-height:1.7}
.best{margin:0 0 6px;font-size:clamp(11px,3.4vw,15px);color:var(--ye)}
.how{margin-top:16px;font-size:clamp(9px,2.8vw,12px);color:#8c80b8;line-height:1.8}
.credit{margin-top:6px;font-size:9px;color:#5a5080;letter-spacing:2px}

.over{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(10,7,22,.6),rgba(10,7,22,.9))}
.reason{font-size:clamp(14px,4.4vw,22px);color:var(--rd);margin:0 0 6px}
.res{font-size:clamp(34px,12vw,60px);color:var(--ye);margin:6px 0}
.stats{margin:12px 0 14px;font-size:clamp(12px,3.6vw,17px);line-height:2;color:#c9b8ff}
.stats b{color:var(--cy);font-weight:400}.stats i{color:var(--ye);font-style:normal}

.shop{background:rgba(10,7,22,.94);justify-content:flex-start;overflow:hidden;touch-action:pan-y}
.shopTop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:62px}
.shopTop .back{font-size:clamp(12px,3.6vw,16px);color:var(--cy);padding:6px 4px}
.shTitle{font-size:clamp(16px,5vw,24px);color:var(--mg);letter-spacing:3px}
.tabs{display:flex;gap:10px;margin:14px 0 12px}
.tab{flex:1;padding:10px 4px;font-size:clamp(11px,3.4vw,15px);color:#8c80b8;background:#120d26;
  box-shadow:-3px 0 0 0 #2a2050,3px 0 0 0 #2a2050,0 -3px 0 0 #2a2050,0 3px 0 0 #2a2050}
.tab.on{color:#0a0716;background:var(--ye);box-shadow:-3px 0 0 0 #a77d10,3px 0 0 0 #a77d10,0 -3px 0 0 #a77d10,0 3px 0 0 #a77d10,0 0 14px rgba(255,216,74,.4)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 4px 10px;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain}
.card{background:#120d26;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:-3px 0 0 0 #2a2050,3px 0 0 0 #2a2050,0 -3px 0 0 #2a2050,0 3px 0 0 #2a2050}
.card.eq{box-shadow:-3px 0 0 0 var(--gr),3px 0 0 0 var(--gr),0 -3px 0 0 var(--gr),0 3px 0 0 var(--gr),0 0 14px rgba(77,255,154,.35)}
.pv{height:68px;display:flex;align-items:center;justify-content:center}
.pv canvas{image-rendering:pixelated;height:100%;width:auto;display:block}
.cname{font-size:clamp(11px,3.3vw,14px);line-height:1.3;min-height:2.6em;display:flex;align-items:center}
.cbtn{width:100%;padding:8px 4px;font-size:clamp(11px,3.3vw,14px);background:var(--ye);color:#0a0716;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35)}
.cbtn.eq{background:var(--gr)}
.cbtn.use{background:var(--cy)}
.cbtn.no{background:#3a2a50;color:#9a8cc0}
.cbtn:active{transform:translateY(2px)}
#toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:20;background:#1a1236;color:var(--ye);padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:-3px 0 0 0 #3a2a60,3px 0 0 0 #3a2a60,0 -3px 0 0 #3a2a60,0 3px 0 0 #3a2a60;white-space:nowrap}
#toast.show{opacity:1}
.shk{animation:shk .3s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

#lang{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:12;font-size:12px;color:var(--cy);padding:6px 9px;background:#120d26;
  box-shadow:-3px 0 0 0 #1f5a66,3px 0 0 0 #1f5a66,0 -3px 0 0 #1f5a66,0 3px 0 0 #1f5a66}

#splash{position:fixed;inset:0;z-index:500;background:#05040c;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease}
#splash.show{opacity:1;pointer-events:auto}
#splash.out{opacity:0;transition:opacity .9s ease;pointer-events:none}
#splashImg{max-width:80vw;max-height:76vh;object-fit:contain;opacity:0;transform:scale(.95);transition:opacity .4s ease,transform .4s ease}
#splash.show #splashImg{opacity:1;transform:scale(1)}
#hearts.many{font-size:1em;letter-spacing:0}
.cdesc{font-size:clamp(9px,2.7vw,11px);line-height:1.4;color:#8c80b8;min-height:2.8em;display:flex;align-items:center;margin-top:-4px}
#joy{position:absolute;z-index:7;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid rgba(55,230,255,.55);background:rgba(55,230,255,.08);pointer-events:none;display:none;box-shadow:0 0 14px rgba(55,230,255,.35)}
#joyK{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(55,230,255,.6);box-shadow:0 0 12px var(--cy)}
#fire{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:7;width:80px;height:80px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--rd);color:#fff;font-size:11px;letter-spacing:0;touch-action:none;
  box-shadow:-4px 0 0 0 #05030c,4px 0 0 0 #05030c,0 -4px 0 0 #05030c,0 4px 0 0 #05030c,inset -4px -4px 0 0 rgba(0,0,0,.3),inset 4px 4px 0 0 rgba(255,255,255,.35),0 0 18px rgba(255,74,74,.6)}
#fire b{font-weight:400;font-size:17px;color:var(--ye)}
#fire:active{transform:translateY(3px)}
#fire.empty{filter:grayscale(.7) brightness(.75)}
</style>
</head>
<body>
<div id="splash"><img id="splashImg" alt=""></div>
<div id="stage">
  <canvas id="cv"></canvas>
  <canvas id="g1"></canvas>
  <canvas id="g2"></canvas>
  <div id="scan"></div><div id="vig"></div>

  <div id="hud">
    <div class="r1">
      <div><div id="hearts" class="neon"></div><div id="coinsV" class="neon"></div></div>
      <div id="tips" class="neon"><span id="tipsV">₩0</span><small id="tipsL">TIP</small></div>
      <div id="dist" class="neon"><span id="distV">0m</span><small id="distL">DIST</small></div>
    </div>
    <div class="tempwrap"><span id="tempL" class="neon">온도</span><div class="tempbar"><div id="tfill"></div></div><span id="tempV" class="neon">100°</span></div>
    <div id="next" class="neon"></div>
  </div>
  <div id="banner"><b class="neon" id="banT"></b><span class="neon" id="banS"></span></div>
  <button id="lang">KO · EN</button>

  <div id="ovTitle" class="ov menu">
    <div><div class="wchip"><span class="coin">◎</span><span id="mCoins">0</span></div>
      <div class="mHead"><div class="mSmall">SPROUTY GAMES</div><h1 class="title neon" id="tTitle"></h1><div class="mTag" id="tSub"></div></div></div>
    <div>
      <div class="best neon" id="tBest"></div>
      <button class="pbtn p1" id="btnStart"></button>
      <button class="pbtn p2" id="btnShop"></button>
      <div class="how" id="tHow"></div>
    </div>
  </div>

  <div id="ovShop" class="ov shop" hidden>
    <div class="shopTop"><button class="back" id="shBack"></button><div class="shTitle neon" id="shTitle"></div><div class="wchip"><span class="coin">◎</span><span id="shCoins">0</span></div></div>
    <div class="tabs"><button class="tab on" data-tab="bikes" id="tabBikes"></button><button class="tab" data-tab="roads" id="tabRoads"></button><button class="tab" data-tab="riders" id="tabRiders"></button></div>
    <div class="grid" id="shGrid"></div>
  </div>

  <div id="ovOver" class="ov over" hidden>
    <p class="reason neon" id="oReason"></p>
    <div class="res neon" id="oScore"></div>
    <div class="stats" id="oStats"></div>
    <button class="pbtn p1" id="btnRetry"></button>
    <button class="pbtn p2" id="btnShop2"></button>
    <button class="pbtn p3" id="btnMenu"></button>
  </div>
  <div id="joy"><div id="joyK"></div></div>
  <button id="fire" tabindex="-1"><span id="fireL">부스터</span><b id="fireN">×0</b></button>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ---------------- i18n ---------------- */
var SP = window.SPROUTY || {lang:"ko", onChange:function(){}};
function isEn(){ return SP.lang === "en"; }
function T(ko,en){ return isEn() ? en : ko; }
function L(o){ return typeof o === "string" ? o : (isEn() ? o.en : o.ko); }
function $(id){ return document.getElementById(id); }
function won(n){ return "₩" + Math.floor(n).toLocaleString(isEn() ? "en-US" : "ko-KR"); }

/* ---------------- splash (opening.jpg) ---------------- */
(function initSplash(){
  var splash = $("splash"), img = $("splashImg"), finished = false;
  function finish(){ if(finished) return; finished = true; splash.classList.add("out"); setTimeout(function(){ splash.style.display = "none"; }, 950); }
  img.addEventListener("error", function(){ splash.style.display = "none"; }, {once:true});
  img.addEventListener("load", function(){ requestAnimationFrame(function(){ splash.classList.add("show"); setTimeout(finish, 1500); }); }, {once:true});
  setTimeout(function(){ if(!finished) finish(); }, 5000);
  img.src = "opening.jpg";
})();

/* ---------------- canvas ---------------- */
var W = 144, H = 256;
var cv=$("cv"), g1=$("g1"), g2=$("g2");
[cv,g1,g2].forEach(function(c){ c.width=W; c.height=H; });
var ctx = cv.getContext("2d"), gx = g1.getContext("2d"), gx2 = g2.getContext("2d");
ctx.imageSmoothingEnabled = false; gx.imageSmoothingEnabled = false;
var LANES = [33,59,85,111];
var ROAD_L = 20, ROAD_R = 124, PY = 206;

/* ---------------- 저장 데이터 / 상점 ---------------- */
var SAVE_KEY = "sprouty_chickenrush_v2", OLD_BEST = "sprouty_chickenrush_best";
var S;
function loadSave(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  d = d || {};
  var s = {coins:Number(d.coins)||0, best:Number(d.best)||0, bikes:Array.isArray(d.bikes)?d.bikes:["classic"], roads:Array.isArray(d.roads)?d.roads:["city"], eqB:d.eqB||"classic", eqR:d.eqR||"city", riders:Array.isArray(d.riders)?d.riders:["honest"], eqD:d.eqD||"honest"};
  if(!s.best){ try{ s.best = Number(localStorage.getItem(OLD_BEST))||0; }catch(e){} }
  if(s.bikes.indexOf("classic") < 0) s.bikes.push("classic");
  if(s.roads.indexOf("city") < 0) s.roads.push("city");
  if(s.riders.indexOf("honest") < 0) s.riders.push("honest");
  return s;
}
function saveS(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
S = loadSave();

var BIKE_SKINS = [
  {id:"classic", name:{ko:"기본 배달 스쿠터", en:"Classic Scooter"}, price:0,   c:{}, trail:["#ffd9a0","#ffb870"]},
  {id:"neon",    name:{ko:"네온 사이클",     en:"Neon Cycle"},      price:60,  c:{o:"#ff4fd8",y:"#37e6ff",c:"#ff4fd8",g:"#a78bff",H:"#b8fbff"}, trail:["#ff4fd8","#37e6ff"]},
  {id:"stealth", name:{ko:"스텔스 블랙",     en:"Stealth Black"},   price:90,  c:{o:"#2a2a38",y:"#ff3b3b",c:"#6a6f80",g:"#3a3a4a",H:"#ff8a8a"}, trail:["#ff3b3b","#7a1a1a"]},
  {id:"gold",    name:{ko:"골드 러너",       en:"Gold Runner"},     price:150, c:{o:"#ffd84a",y:"#fff7c2",c:"#ffe27a",g:"#c9a13a",H:"#fff7c2"}, trail:["#ffd84a","#fff7c2"]},
  {id:"lime",    name:{ko:"라임 터보",       en:"Lime Turbo"},      price:220, c:{o:"#4dff9a",y:"#eaffd0",c:"#4dff9a",g:"#2fbf75",H:"#d8ffe8"}, trail:["#4dff9a","#d8ffe8","#37e6ff"]}
];
function mkRoadTile(sk, w, h){
  var c = document.createElement("canvas"); c.width = w; c.height = h;
  var x = c.getContext("2d");
  x.fillStyle = sk.road; x.fillRect(0,0,w,h);
  for(var i=0;i<260;i++){ x.fillStyle = sk.sp[Math.random()<.5?0:1]; x.fillRect(Math.floor(Math.random()*w), Math.floor(Math.random()*h), 1+Math.floor(Math.random()*2), 1); }
  if(sk.deco) sk.deco(x, w, h);
  return c;
}
var ROAD_SKINS = [
  {id:"city",   name:{ko:"야간 도시",     en:"Night City"},    price:0,   bg:"#0a0716", road:"#15152a", sp:["#1b1b34","#101022"], eL:"#37e6ff", eR:"#ff4fd8", dash:"#58588a", curb:"#2a2848", bcols:["#171428","#1b1830","#14122a","#1d1a36"], fx:{type:"rain",  color:"#8cc8ff"}},
  {id:"grid",   name:{ko:"사이버 그리드", en:"Cyber Grid"},    price:100, bg:"#05081a", road:"#0b0f26", sp:["#101a44","#080c1e"], eL:"#4dff9a", eR:"#37e6ff", dash:"#2a6aff", curb:"#15245a", bcols:["#0a1030","#0d1540","#08102a","#101a4a"], fx:{type:"bits",  color:"#4dff9a"},
     deco:function(x,w,h){ x.fillStyle = "#16226a"; for(var gxp=0; gxp<w; gxp+=13) x.fillRect(gxp,0,1,h); for(var gyp=0; gyp<h; gyp+=16) x.fillRect(0,gyp,w,1); }},
  {id:"sunset", name:{ko:"석양 해안도로", en:"Sunset Coast"},  price:140, bg:"#1a0a24", road:"#2b1633", sp:["#3a1c44","#210f29"], eL:"#ffd84a", eR:"#ff4fd8", dash:"#ff9a6a", curb:"#5a2a4a", bcols:["#2a1630","#35193a","#241028","#3a1c40"], fx:{type:"none"},
     deco:function(x,w,h){ x.fillStyle = "rgba(255,120,90,.10)"; for(var yy=0; yy<h; yy+=8) x.fillRect(0,yy,w,2); }},
  {id:"sakura", name:{ko:"벚꽃 길",       en:"Sakura Road"},   price:180, bg:"#140a1e", road:"#221b2e", sp:["#2c2338","#191322"], eL:"#ff9ad0", eR:"#ffd0e8", dash:"#b79ac8", curb:"#4a2a50", bcols:["#241a30","#2a1c38","#1e1428","#2e2040"], fx:{type:"petal", color:"#ffb7d5"},
     deco:function(x,w,h){ x.fillStyle = "#ff9ad0"; for(var i=0;i<46;i++) x.fillRect(Math.floor(Math.random()*w), Math.floor(Math.random()*h), 2, 1); }},

function scrollWorld(sp, dt){

  });
  var ft = curRoad.fx.type;
  fxp.forEach(function(r){
    if(ft === "rain"){ r.y += (230 + sp*.6)*r.s*dt; r.x -= 26*dt; }
    else if(ft === "snow"){ r.y += (22 + sp*.12)*r.s*dt; r.x += Math.sin(tAcc*1.5 + r.ph)*10*dt; }
    else if(ft === "petal"){ r.y += (26 + sp*.15)*r.s*dt; r.x -= (14 + Math.sin(tAcc*2 + r.ph)*10)*dt; }
    else if(ft === "bits"){ r.y += (90 + sp*.5)*r.s*dt; }
    if(r.y > H){ r.y = -r.l; r.x = Math.random()*(W+20); }

  scrollWorld(G.speed, dt);

  if(G.mode === "free") moveFree(dt); else { G.px = lerp(G.px, LANES[G.lane], Math.min(1, dt*45)); if(Math.abs(G.px - LANES[G.lane]) < 1.5) G.px = LANES[G.lane]; }
  if(G.boost > 0){ G.boost -= dt; G.inv = Math.max(G.inv, .15); if(G.boost <= 0){ G.boost = 0; G.inv = Math.max(G.inv, .4); } }
  if(G.inv > 0) G.inv -= dt;

  G.spawnT -= dt;

    spawnWave(0);
    if(G.deliveries >= 2 && Math.random() < .3) spawnWave(-70);
    G.spawnT = (.45 + Math.random()*.4) * (150 / G.speed);
  }

  for(var i=G.ents.length-1;i>=0;i--){
    var e = G.ents[i];
    e.y += G.speed*e.f*dt;
    if(e.sw){ // 차선 끼어들기: 깜빡이 → 이동
      var sw = e.sw;
      if(sw.st === 0 && e.y > 20 && e.y < PY - 80){
        var opts = []; if(e.lane > 0) opts.push(e.lane-1); if(e.lane < 3) opts.push(e.lane+1);

      else if(sw.st === 2){

    var dx = Math.abs(e.x - G.px), dy = Math.abs(e.y - G.py);
    var ox = (e.w/2 + 3) - 1, oy = (e.h/2 + 6) - 1;
    if(e.t === "fire" || e.t === "coin"){
      if(dx < e.w/2 + 5 && dy < e.h/2 + 8){

      continue;

  $("oScore").textContent = won(G.tips);
  $("oStats").innerHTML = (G.newBest ? '<b>★ NEW BEST! ★</b><br>' : T("최고 ", "Best ") + '<b>' + won(S.best) + '</b><br>') +
    T("배달 완료 ", "Deliveries ") + '<b>' + G.deliveries + '</b> · ' + T("거리 ", "Dist ") + '<b>' + Math.floor(G.meters) + 'm</b><br>' +
    T("획득 코인 ", "Coins earned ") + '<i>◎ +' + G.coins + '</i> · ' + T("보유 ", "Total ") + '<i>◎ ' + S.coins + '</i>';
}
function startGame(){
  SFX.start();
  initCity(); initFx(); dashOff = lampOff = tileOff = 0;
  resetGame();
  $("ovTitle").hidden = true; $("ovOver").hidden = true; $("ovShop").hidden = true; $("hud").style.display = "block";
  hudCache = {}; $("banner").classList.remove("show"); joyEnd();
}
function toTitle(){
  hideControls(); G = {state:"title", px:LANES[1], ents:[], parts:[], pops:[], temp:100, hearts:3, shake:0, flash:0};
  $("ovOver").hidden = true; $("ovShop").hidden = true; $("ovTitle").hidden = false; $("hud").style.display = "none";
  applyLang();
}

/* ---------------- 상점 ---------------- */
var shopTab = "bikes";
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove("show"); }, 1400); }
function openShop(){
  SFX.click();
  hideControls(); G = {state:"shop", px:LANES[1], ents:[], parts:[], pops:[], temp:100, hearts:3, shake:0, flash:0};
  $("ovTitle").hidden = true; $("ovOver").hidden = true; $("ovShop").hidden = false; $("hud").style.display = "none";
  applyLang(); renderShop();
}
function previewCanvas(kind, item){
  var c = document.createElement("canvas");
  if(kind === "bikes"){
    var sp = bikeSprite(item); c.width = sp.w + 4; c.height = sp.h + 2;
    var x = c.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(sp.base, 2, 1);
  } else if(kind === "riders"){
    c.width = 40; c.height = 40; var x3 = c.getContext("2d"); x3.imageSmoothingEnabled = false;
    x3.fillStyle = "#15152a"; x3.fillRect(0,0,40,40);
    x3.drawImage(bikeSprite().base, 14, 12);
    if(item.id === "honest"){
      x3.fillStyle = "#58588a";
      for(var yy2=2; yy2<40; yy2+=8){ x3.fillRect(7,yy2,1,4); x3.fillRect(32,yy2,1,4); }
    } else if(item.id === "free"){
      x3.fillStyle = "#2a2050"; x3.fillRect(26,26,12,12);
      x3.fillStyle = "#37e6ff"; x3.fillRect(29,29,6,6);
      x3.fillStyle = "#b8fbff"; x3.fillRect(30,30,2,2);
      x3.fillStyle = "#37e6ff"; x3.fillRect(31,23,2,2); x3.fillRect(31,38,2,1); x3.fillRect(24,31,2,2); x3.fillRect(38,31,1,2);
    } else {
      x3.fillStyle = "#37e6ff"; x3.fillRect(17,28,3,8); x3.fillStyle = "#fff"; x3.fillRect(18,28,1,5);
      x3.fillStyle = "#b8fbff"; for(var yy3=4; yy3<38; yy3+=9){ x3.fillRect(8,yy3,1,5); x3.fillRect(30,yy3+3,1,5); }
      x3.fillStyle = "#37e6ff"; x3.fillRect(10,10,1,18); x3.fillRect(27,10,1,18); x3.fillRect(10,10,18,1); x3.fillRect(10,27,18,1);
    }
  } else {
    c.width = 40; c.height = 40; var x2 = c.getContext("2d"); x2.imageSmoothingEnabled = false;
    x2.fillStyle = item.bg; x2.fillRect(0,0,40,40);
    x2.drawImage(roadTile(item), 0, 0, 24, 40, 8, 0, 24, 40);
    x2.fillStyle = item.eL; x2.fillRect(8,0,1,40); x2.fillStyle = item.eR; x2.fillRect(31,0,1,40);
    x2.fillStyle = item.dash; for(var yy=2; yy<40; yy+=10) x2.fillRect(20,yy,1,5);
    x2.fillStyle = item.bcols[1]; x2.fillRect(0,0,7,40); x2.fillRect(33,0,7,40);
  }
  return c;
}
function shopData(){
  if(shopTab === "bikes") return {list:BIKE_SKINS, owned:S.bikes, eq:S.eqB};
  if(shopTab === "roads") return {list:ROAD_SKINS, owned:S.roads, eq:S.eqR};
  return {list:RIDERS, owned:S.riders, eq:S.eqD};
}
function renderShop(){
  var grid = $("shGrid");
  var keep = grid.getAttribute("data-tab") === shopTab ? grid.scrollTop : 0; // 구매/장착 시 스크롤 유지
  grid.innerHTML = "";
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-tab") === shopTab); });
  var d = shopData(), list = d.list, owned = d.owned, eq = d.eq;
  list.forEach(function(it){
    var isOwned = owned.indexOf(it.id) >= 0, isEq = eq === it.id;
    var card = document.createElement("div"); card.className = "card" + (isEq ? " eq" : "");
    var pv = document.createElement("div"); pv.className = "pv"; pv.appendChild(previewCanvas(shopTab, it)); card.appendChild(pv);
    var nm = document.createElement("div"); nm.className = "cname"; nm.textContent = L(it.name); card.appendChild(nm);
    if(it.desc){ var ds = document.createElement("div"); ds.className = "cdesc"; ds.textContent = L(it.desc); card.appendChild(ds); }
    var b = document.createElement("button");
    if(isEq){ b.className = "cbtn eq"; b.textContent = T("장착 중", "EQUIPPED"); b.disabled = true; }
    else if(isOwned){ b.className = "cbtn use"; b.textContent = T("장착", "EQUIP"); b.setAttribute("data-act","equip"); }
    else { b.className = "cbtn" + (S.coins < it.price ? " no" : ""); b.textContent = "◎ " + it.price; b.setAttribute("data-act","buy"); }
    b.setAttribute("data-id", it.id); card.appendChild(b);
    grid.appendChild(card);
  });
  grid.setAttribute("data-tab", shopTab);
  grid.scrollTop = keep;
}
function shopAction(act, id){
  var d = shopData(), it = byId(d.list, id), owned = d.owned;
  if(act === "buy"){
    if(owned.indexOf(it.id) >= 0) return;
    if(S.coins < it.price){ SFX.no(); toast(T("코인이 부족해요!", "Not enough coins!")); var w = document.querySelector("#ovShop .wchip"); w.classList.remove("shk"); void w.offsetWidth; w.classList.add("shk"); return; }
    S.coins -= it.price; owned.push(it.id); SFX.buy(); toast(L(it.name) + T(" 구매!", " purchased!"));
  } else SFX.click();
  if(shopTab === "bikes"){ S.eqB = it.id; curBike = it; }
  else if(shopTab === "roads"){ S.eqR = it.id; curRoad = it; }
  else { S.eqD = it.id; curRider = it; }
  saveS(); updateWallet(); renderShop(); applyLang();
}

/* ---------------- input ---------------- */
var down = null;
$("stage").addEventListener("pointerdown", function(e){
  if(G.state === "play" && G.mode === "free"){ if(!joy.on) joyStart(e); return; }
  down = {x:e.clientX, y:e.clientY};
});
$("stage").addEventListener("pointermove", function(e){ if(joy.on && e.pointerId === joy.id) joyMove(e); });
$("stage").addEventListener("pointercancel", function(e){ if(joy.on && e.pointerId === joy.id) joyEnd(); down = null; });
$("stage").addEventListener("pointerup", function(e){
  if(joy.on && e.pointerId === joy.id){ joyEnd(); down = null; return; }
  if(!down || G.state !== "play" || G.mode === "free"){ down = null; return; }
  var dx = e.clientX - down.x;
  if(Math.abs(dx) > 28) changeLane(dx > 0 ? 1 : -1);
  else { var r = $("stage").getBoundingClientRect(); changeLane(e.clientX < r.left + r.width/2 ? -1 : 1); }
  down = null;
});
$("fire").addEventListener("pointerdown", function(e){ e.stopPropagation(); e.preventDefault(); shoot(); });
$("fire").addEventListener("pointerup", function(e){ e.stopPropagation(); });
window.addEventListener("keydown", function(e){
  var k = e.key;
  if(k === "ArrowLeft" || k === "a" || k === "A"){ keys.l = 1; changeLane(-1); }
  else if(k === "ArrowRight" || k === "d" || k === "D"){ keys.r = 1; changeLane(1); }
  else if(k === "ArrowUp" || k === "w" || k === "W"){ keys.u = 1; if(!e.repeat) shoot(); }
  else if(k === "ArrowDown" || k === "s" || k === "S"){ keys.d = 1; }
  else if(k === "f" || k === "F"){ if(!e.repeat) shoot(); }
  else if(k === "Enter" || k === " "){
    if(G.state === "play"){ if(k === " "){ e.preventDefault(); if(!e.repeat) shoot(); } }
    else if(G.state === "title") startGame();
    else if(G.state === "over" && !$("ovOver").hidden) startGame();
  }
});
window.addEventListener("keyup", function(e){
  var k = e.key;
  if(k === "ArrowLeft" || k === "a" || k === "A") keys.l = 0;
  else if(k === "ArrowRight" || k === "d" || k === "D") keys.r = 0;
  else if(k === "ArrowUp" || k === "w" || k === "W") keys.u = 0;
  else if(k === "ArrowDown" || k === "s" || k === "S") keys.d = 0;
});
window.addEventListener("blur", function(){ keys.l = keys.r = keys.u = keys.d = 0; joyEnd(); });
$("btnStart").addEventListener("click", startGame);
$("btnRetry").addEventListener("click", startGame);
$("btnMenu").addEventListener("click", function(){ SFX.click(); toTitle(); });
$("btnShop").addEventListener("click", openShop);
$("btnShop2").addEventListener("click", openShop);
$("shBack").addEventListener("click", function(){ SFX.click(); toTitle(); });
document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ shopTab = t.getAttribute("data-tab"); SFX.click(); renderShop(); }); });
$("shGrid").addEventListener("click", function(e){ var b = e.target.closest("[data-act]"); if(b) shopAction(b.getAttribute("data-act"), b.getAttribute("data-id")); });
$("lang").addEventListener("click", function(e){ e.stopPropagation(); if(SP.set) SP.set(isEn() ? "ko" : "en"); });
$("lang").addEventListener("pointerdown", function(e){ e.stopPropagation(); });
SP.onChange(applyLang);
window.addEventListener("beforeunload", saveS);

/* ---------------- loop ---------------- */
var last = 0, paused = false;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last = ts;
  var dt = Math.min(.05, (ts - last)/1000); last = ts;
  if(paused) return;
  update(dt); draw(); updateHUD();
}
document.addEventListener("visibilitychange", function(){ paused = document.hidden; last = 0; if(document.hidden) saveS(); });

function boot(){ initCity(); initFx(); toTitle(); requestAnimationFrame(frame); }
var fontReady = (document.fonts && document.fonts.load) ?
  Promise.race([document.fonts.load("9px Galmuri9", "치킨 배달 ABC 0123"), new Promise(function(r){ setTimeout(r, 2500); })]) : Promise.resolve();
fontReady.then(boot, boot);
})();
</script>
</body>
</html>
